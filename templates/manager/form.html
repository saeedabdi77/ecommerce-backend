{% extends "manager/base.html" %}

{% block content %}

<div class="page-toolbar">
    <div>
        <div class="page-description">{{ action.label }}</div>
    </div>
</div>

<div class="form-card">
    <form method="post" enctype="multipart/form-data" class="manager-form">
        {% csrf_token %}

        <div class="form-grid">
            {% for field in form %}
                <div class="form-field{% if field.errors %} field-error{% endif %}{% if field.field.widget.attrs.full_width %} full-width{% endif %}">
                    {{ field.label_tag }}

                    {{ field }}

                    {% if field.help_text %}
                        <div class="form-help">{{ field.help_text }}</div>
                    {% endif %}

                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>

        <div class="form-actions">
            <a href="{{ manager.get_list_url }}" class="btn btn-secondary">
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Save
            </button>
        </div>
    </form>
</div>

{% endblock %}
