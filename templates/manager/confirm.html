{% extends "manager/base.html" %}

{% block content %}

<div class="page-toolbar">
    <div>
        <div class="page-description">{{ action.label }}</div>
    </div>
</div>

<div class="confirm-card">
    <p>{{ action.confirmation_message }}</p>

    <form method="post">
        {% csrf_token %}

        <div class="form-actions">
            <a href="{{ list_url }}" class="btn btn-secondary">انصراف</a>
            <button type="submit" class="btn btn-danger">تأیید</button>
        </div>
    </form>
</div>

{% endblock %}
