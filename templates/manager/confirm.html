{% extends "manager/base.html" %}

{% block content %}
<div class="manager-header">
    <h1>{{ action.label }}</h1>
</div>

<div class="confirm-card">
    <p>{{ action.confirmation_message }}</p>

    <form method="post">
        {% csrf_token %}

        <div class="form-actions">
            <button type="submit" class="btn btn-danger">
                Confirm
            </button>

            <a href="{{ manager.get_list_url }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
