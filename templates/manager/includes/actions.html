{% for action in actions %}
    {% if action.bulk %}
        <button
            type="submit"
            formaction="{% url 'manager:bulk-action' manager=manager.slug action=action.name %}"
            class="btn btn-secondary"
            {% if action.confirm %}onclick="return confirm('{{ action.confirmation_message }}');"{% endif %}
        >
            {{ action.label }}
        </button>
    {% endif %}
{% endfor %}
