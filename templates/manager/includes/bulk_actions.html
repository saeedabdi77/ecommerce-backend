{% load manager_tags %}

<div class="bulk-toolbar" id="bulk-toolbar">

    <div class="bulk-selection">
        <strong id="selected-count">0</strong>
        مورد انتخاب شده
    </div>

    <div class="bulk-actions">

        {% for item in bulk_actions %}
            <button
                type="submit"
                formaction="{{ item.url }}"
                class="btn btn-secondary bulk-action-btn"
                disabled
                {% if item.action.confirm %}
                    onclick="return confirm('{{ item.action.confirmation_message|escapejs }}');"
                {% endif %}
            >
                {{ item.action.label }}
            </button>
        {% endfor %}

    </div>

</div>
