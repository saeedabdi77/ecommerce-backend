{% load manager_tags %}

<form method="get" class="filters-card" id="filters-form">

    {% if has_search %}
        <div class="record-search">
            <label for="id_search" class="record-search-label">جستجو در رکوردها</label>
            <div class="record-search-row">
                <input
                    type="search"
                    id="id_search"
                    name="search"
                    value="{{ search|default:'' }}"
                    placeholder="{{ search_placeholder }}"
                    class="filter-search-input"
                >
                <button type="submit" class="btn btn-primary">جستجو</button>
                {% if search %}
                    <a href="{% remove_filter 'search' %}" class="btn btn-secondary">پاک کردن</a>
                {% endif %}
            </div>
        </div>
    {% endif %}

    {% if filter_form.fields %}
        <div class="filters-top">
            <div class="filters-top-actions">
                <button type="button"
                        class="btn btn-secondary filters-toggle-btn {% if has_active_filters %}is-open{% endif %}"
                        id="filters-toggle"
                        aria-expanded="{% if has_active_filters %}true{% else %}false{% endif %}">
                    فیلترهای پیشرفته
                    <span class="filters-toggle-icon">▼</span>
                </button>
            </div>
        </div>

        <div class="filters-panel {% if has_active_filters %}is-open{% endif %}" id="filters-panel">

            <div class="filters-body">
                {% for field in filter_form %}
                    <div class="filter-field">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}

                        {% if field.errors %}
                            <div class="field-errors">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <div class="filters-footer">
                <a href="." class="btn btn-secondary">پاک کردن فیلترها</a>
                <button type="submit" class="btn btn-primary">اعمال فیلتر</button>
            </div>

        </div>
    {% endif %}

</form>
